name: 🚀 CI Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  # Disabled automatic triggering. Re-enable by restoring the pull_request trigger below.
  # pull_request:
  #   branches:
  #     - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.x"
          channel: stable
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}

      - name: 🔐 Configure Git for private packages
        run: |
          git config --global url."https://${{ secrets.PACKAGES_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --list | grep url
        env:
          PACKAGES_ACCESS_TOKEN: ${{ secrets.PACKAGES_ACCESS_TOKEN }}

      - name: 📦 Install Dependencies
        run: |
          dart pub global activate very_good_cli 1.1.1
          very_good packages get --recursive --ignore=!*

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: 🕵️ Analyze
        run: flutter analyze lib test

      - name: ✅ Bloc Lint
        run: |
          flutter pub global activate bloc_tools
          bloc lint .

      - name: 🧪 Run Tests
        run: >-
          very_good test
          -j 4
          --optimization
          --coverage
          --min-coverage 100
          --report-on "lib"
          --show-uncovered
          --test-randomize-ordering-seed random
